schema_version: 1
id: make-harnesses-swappable
title: "Making coding harnesses swappable"
status: investigating
started_on: '2026-10-17'
question: >-
  How can conversational coding harnesses share capabilities, enforced tool rules,
  and recoverable workflow state through a stable interface, and what is the
  smallest reproduction that demonstrates the separation?
motivation: >-
  The captured r/LLMDevs thread proposes reusable capabilities behind interfaces
  instead of tying their behavior to one coding harness. We want to understand
  the mechanism and compare what must be moved or reconfigured when a second
  harness continues the same work.
working_hypothesis: >-
  A shared application core exposed through CLI and MCP adapters can keep tool
  semantics and persisted work stable across harness changes. Recovery requires
  explicit state and retry semantics in addition to a common protocol.
guidance: ../README.md
comparison:
  baseline: >-
    A Claude Code skill and deterministic helper scripts, with the
    conversational model coordinating the reporting procedure.
  proposed_change: >-
    Move step validation, domain results, and retry semantics into a shared
    application core called through CLI and MCP adapters. The first prototype
    still relies on the harness to request each step.
  workload: >-
    The locally devised task in
    [reproduction.md — Source-report task](reproduction.md#source-report-task)
    reads [reddit-program-interface.yaml](sources/reddit-program-interface.yaml)
    and produces factual counts and source metadata. Its fixed input and two steps
    make interruption, handoff, and retry behavior observable.
  held_constant:
    - "Source fixture and deterministic calculation logic."
    - "Prompt and model configuration where available in the later summary comparison."
scope:
  include:
    - "Compare the same task with a concrete Claude Code baseline before asserting architectural differences."
    - "Follow one call from the conversational harness into application code."
    - "Separate instructions, tool contracts, policy checks, workflow state, and transport."
    - "Specify a local reproduction with deterministic steps before adding an inner model."
    - "Test a harness change, process restart, duplicate request, and rejected operation."
    - "Research BEAM/Elixir and Jido application ownership, including external coding harnesses as workers."
    - "Check related primary-source work and MCP's published stateless protocol revision."
  defer:
    - "Production orchestration, remote authentication, and multi-user deployment."
    - "A survey or benchmark of every coding harness."
    - "Implementation of automatic background recovery and observability service integration."
    - "Implementing or benchmarking the proposed BEAM/Jido and coding-worker extensions."
