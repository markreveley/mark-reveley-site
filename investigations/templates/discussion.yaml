# Canonical source text. Generate a Markdown reading view with render_discussion.py.
schema_version: 1
id: example-discussion
kind: discussion
platform: reddit
title: "Replace with the source title"
url: "https://example.com/discussion"
community: null
navigation:
  overview: null # Topic README path, relative to this YAML file
  next: null # Next reading document, relative to this YAML file
capture:
  method: user_paste
  imported_on: null # YYYY-MM-DD, quoted
  captured_at: null # Original capture timestamp, if known
  relative_age_reference_date: null # Fixed YYYY-MM-DD for calculated dates
  relative_age_reference_basis: null # Known capture date or explicit user assumption
  raw_file: null # Relative to this YAML file
  completeness: unknown # e.g. pasted_excerpt or complete_at_capture
  live_verification: not_checked
  verification_notes: []
  transformations:
    - "Removed interface controls; preserved body wording and order."
post:
  id: post
  platform_id: null
  author: null
  author_basis: unknown # explicit, inferred_from_op_badge, or unknown
  published_at: null
  estimated_published_on: null # Derived date; keep separate from verified publication
  age_label: null
  displayed_score: null
  content_status: present
  body: |-
    Replace with the exact post body.
comments:
  - id: c01
    platform_id: null
    parent_id: null # Unknown; use post only when top-level is established
    parent_basis: unknown
    author: null
    author_is_op: false
    published_at: null
    estimated_published_on: null
    age_label: null
    displayed_score: null
    content_status: present
    body: |-
      Replace with the exact comment body.
    notes: []
